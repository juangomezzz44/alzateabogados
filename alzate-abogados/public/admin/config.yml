backend:
  name: github
  repo: juangomezzz44/alzateabogados
  branch: main

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
media_folder: public/assets/uploads
public_folder: /assets/uploads
site_url: /
display_url: /
logo_url: /assets/img/logo-mark-green.png

collections:
  - name: articulos
    label: Artículos jurídicos
    label_singular: Artículo
    folder: content/articulos
    extension: md
    format: frontmatter
    create: true
    editor: { preview: false }
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title, published]
    description: >-
      Un artículo SOLO aparece en el sitio si "Publicar en el sitio" está activado, tiene fecha y tiene texto.
    fields:
      - { name: title, label: Título, widget: string }
      - name: description
        label: Resumen para Google y para compartir
        widget: text
      - name: date
        label: Fecha de publicación
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        required: false
        default: "{{now}}"
      - name: published
        label: Publicar en el sitio
        widget: boolean
        default: false
      - name: comingSoon
        label: Mostrar como "Próximamente"
        widget: boolean
        default: false
        required: false
      - name: topic
        label: Tema para el mensaje de WhatsApp
        widget: string
        required: false
      - { name: outline, label: Esquema, widget: hidden, required: false }
      - name: body
        label: Texto del artículo
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]

  - name: sitio
    label: Datos del sitio
    editor: { preview: false }
    files:
      - name: contacto
        label: Contacto, perfil y datos legales
        file: content/settings.json
        format: json
        fields:
          - label: Contacto
            name: contact
            widget: object
            collapsed: false
            fields:
              - name: whatsappNumber
                label: Número de WhatsApp
                widget: string
                pattern: ['^57\d{10}$', "Debe empezar por 57 y tener 12 dígitos"]
              - { name: email, label: Correo de contacto, widget: string, required: false }
              - { name: city, label: Ciudad, widget: string, required: false }
              - { name: coverage, label: Cobertura, widget: string, required: false }
              - { name: address, label: Dirección, widget: string, required: false }
              - { name: hours, label: Horarios, widget: string, required: false }
              - { name: modality, label: Modalidad de atención, widget: string, required: false }
          - label: Perfil del abogado
            name: profile
            widget: object
            fields:
              - { name: bio, label: Biografía, widget: text, required: false }
              - { name: professionalCard, label: Tarjeta profesional, widget: string, required: false }
              - { name: showCredentialsFromPhoto, label: Mostrar la formación, widget: boolean, default: true }
          - label: Tratamiento de datos personales
            name: privacy
            widget: object
            fields:
              - { name: responsible, label: Responsable del tratamiento, widget: string, required: false }
              - { name: contactChannel, label: Correo para consultas, widget: string, required: false }
              - { name: lastUpdated, label: Fecha de actualización, widget: string, required: false }
              - { name: validatedByLawyer, label: El abogado validó esta política, widget: boolean, default: false }
          - label: Publicación
            name: site
            widget: object
            fields:
              - { name: url, label: Dirección del sitio, widget: string, required: false }
          - label: Contenido jurídico
            name: content
            widget: object
            fields:
              - name: sucesiones
                label: Dónde mostrar "Sucesiones"
                widget: select
                options:
                  - { label: Dentro de Derecho de familia, value: familia }
                  - { label: Como área independiente, value: propia }
                default: familia
              - { name: legalReviewDone, label: El abogado aprobó los textos, widget: boolean, default: false }

      - name: servicios
        label: Servicios
        file: content/servicios.json
        format: json
        fields:
          - label: Derecho de familia (servicios)
            name: familia
            widget: list
            summary: "{{fields.name}}"
            fields: &servicio
              - { name: name, label: Nombre del servicio, widget: string }
              - { name: text, label: Explicación breve, widget: text }
              - { name: asunto, label: Frase WhatsApp, widget: string, required: false }
              - name: icon
                label: Ícono
                widget: select
                default: document
                options:
                  - { label: Anillos, value: rings }
                  - { label: Enlace, value: link }
                  - { label: Edificio con frontón, value: scale-balance }
                  - { label: Casa, value: home }
                  - { label: Niño o niña, value: child }
                  - { label: Monedas, value: coins }
                  - { label: Persona con lupa, value: search-person }
                  - { label: Documento, value: document }
                  - { label: Libro, value: book }
                  - { label: Edificio de oficinas, value: building }
              - { name: slug, label: Identificador interno, widget: hidden, required: false }
          - { label: Derecho civil, name: civil, widget: object, fields: *servicio }
          - { label: Sociedades comerciales, name: comercial, widget: object, fields: *servicio }

      - name: faq
        label: Preguntas frecuentes
        file: content/faq.json
        format: json
        fields:
          - label: Preguntas
            name: items
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: Pregunta, widget: string }
              - label: Respuesta
                name: a
                widget: list
                field: { label: Párrafo, name: parrafo, widget: text }
                
